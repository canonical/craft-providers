name: Update Copilot Instructions
on:
  schedule:
    - cron: "0 9 * * 1" # Run every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    # Pin the workflow logic to a release tag; content version remains controlled by .github/.copilot-collections.yaml
uses: canonical/copilot-collections/.github/workflows/auto_update_collections.yaml@a1d5b76818fc16a7df2a2b1c6eb26a226da9eed2
    secrets: inherit
